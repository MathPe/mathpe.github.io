<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Les gouttelettes microscopiques d’un nuage</title>
  <desc id="desc">Schéma d’un nuage composé d’air et de nombreuses petites gouttelettes d’eau, avec une gouttelette représentée en vue fortement agrandie.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7f5ff"/>
      <stop offset="1" stop-color="#f8fcff"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f8fc"/>
    </linearGradient>
    <radialGradient id="drop" cx="32%" cy="25%" r="75%">
      <stop offset="0" stop-color="#f9ffff"/>
      <stop offset=".42" stop-color="#a8e4f3"/>
      <stop offset="1" stop-color="#47a9cc"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#6b9fb6" flood-opacity=".16"/>
    </filter>
    <clipPath id="zoomClip"><circle cx="1195" cy="535" r="270"/></clipPath>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#4b8197" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1450" cy="145" r="58" fill="#fff2c9" opacity=".85"/>
  <circle cx="1450" cy="145" r="78" fill="none" stroke="#fff2c9" stroke-width="2" opacity=".55"/>

  <text x="100" y="112" fill="#17384a" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="700">Que contient un nuage ?</text>
  <text x="103" y="163" fill="#527386" font-family="Arial, Helvetica, sans-serif" font-size="25">À l’échelle microscopique, le nuage est fait de gouttelettes minuscules en suspension dans l’air.</text>

  <!-- Cloud silhouette -->
  <g filter="url(#softShadow)">
    <path d="M183 673 C128 673 91 638 91 586 C91 536 128 499 181 494 C180 420 238 366 310 366 C368 366 419 397 442 447 C470 394 522 364 583 364 C669 364 729 424 731 501 C791 506 829 544 829 593 C829 641 790 673 733 673 Z" fill="url(#cloud)" stroke="#b9d6e4" stroke-width="4"/>
  </g>
  <text x="164" y="316" fill="#4b7185" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="1.4">DANS LE NUAGE</text>
  <text x="163" y="717" fill="#365c70" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Air + beaucoup de gouttelettes d’eau</text>

  <!-- Tiny illustrative droplets dispersed through cloud -->
  <g fill="#77c6df" opacity=".86">
    <circle cx="222" cy="559" r="7"/><circle cx="274" cy="511" r="5"/><circle cx="317" cy="590" r="6"/>
    <circle cx="351" cy="470" r="5"/><circle cx="388" cy="545" r="7"/><circle cx="438" cy="600" r="5"/>
    <circle cx="473" cy="493" r="6"/><circle cx="513" cy="565" r="5"/><circle cx="551" cy="445" r="6"/>
    <circle cx="590" cy="522" r="7"/><circle cx="634" cy="585" r="5"/><circle cx="672" cy="473" r="6"/>
    <circle cx="721" cy="551" r="5"/><circle cx="253" cy="620" r="5"/><circle cx="337" cy="430" r="4"/>
    <circle cx="418" cy="485" r="4"/><circle cx="529" cy="618" r="4"/><circle cx="611" cy="455" r="4"/>
  </g>
  <g fill="#d4f2fa" opacity=".9">
    <circle cx="222" cy="557" r="2"/><circle cx="388" cy="543" r="2"/><circle cx="590" cy="520" r="2"/><circle cx="672" cy="471" r="2"/>
  </g>

  <!-- Magnification callout -->
  <path d="M744 452 C842 390 875 354 946 330" fill="none" stroke="#4b8197" stroke-width="3" stroke-dasharray="9 10" marker-end="url(#arrow)"/>
  <path d="M748 612 C835 668 881 700 956 736" fill="none" stroke="#4b8197" stroke-width="3" stroke-dasharray="9 10"/>
  <text x="950" y="205" fill="#4b7185" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="1.4">VUE FORTEMENT AGRANDIE</text>
  <circle cx="1195" cy="535" r="279" fill="#ffffff" stroke="#9cc8d9" stroke-width="5"/>
  <g clip-path="url(#zoomClip)">
    <rect x="925" y="265" width="540" height="540" fill="#f7fcff"/>
    <circle cx="1005" cy="355" r="17" fill="url(#drop)" stroke="#5bb1ce" stroke-width="2"/>
    <circle cx="1110" cy="347" r="25" fill="url(#drop)" stroke="#5bb1ce" stroke-width="2"/>
    <circle cx="1240" cy="360" r="18" fill="url(#drop)" stroke="#5bb1ce" stroke-width="2"/>
    <circle cx="1360" cy="340" r="29" fill="url(#drop)" stroke="#5bb1ce" stroke-width="2"/>
    <circle cx="1056" cy="456" r="31" fill="url(#drop)" stroke="#5bb1ce" stroke-width="2"/>
    <circle cx="1185" cy="455" r="21" fill="url(#drop)" stroke="#5bb1ce" stroke-width="2"/>
    <circle cx="1315" cy="463" r="37" fill="url(#drop)" stroke="#5bb1ce" stroke-width="2"/>
    <circle cx="1410" cy="505" r="15" fill="url(#drop)" stroke="#5bb1ce" stroke-width="2"/>
    <circle cx="990" cy="565" r="28" fill="url(#drop)" stroke="#5bb1ce" stroke-width="2"/>
    <circle cx="1116" cy="578" r="39" fill="url(#drop)" stroke="#5bb1ce" stroke-width="2"/>
    <circle cx="1260" cy="574" r="24" fill="url(#drop)" stroke="#5bb1ce" stroke-width="2"/>
    <circle cx="1375" cy="620" r="32" fill="url(#drop)" stroke="#5bb1ce" stroke-width="2"/>
    <circle cx="1042" cy="690" r="18" fill="url(#drop)" stroke="#5bb1ce" stroke-width="2"/>
    <circle cx="1184" cy="697" r="29" fill="url(#drop)" stroke="#5bb1ce" stroke-width="2"/>
    <circle cx="1310" cy="720" r="18" fill="url(#drop)" stroke="#5bb1ce" stroke-width="2"/>
    <g fill="#ffffff" opacity=".82">
      <circle cx="1048" cy="447" r="5"/><circle cx="1178" cy="449" r="4"/><circle cx="1304" cy="453" r="6"/>
      <circle cx="1105" cy="567" r="7"/><circle cx="1253" cy="568" r="4"/><circle cx="1367" cy="612" r="5"/>
    </g>
  </g>

  <!-- Leader label -->
  <path d="M1340 457 C1402 428 1437 415 1482 414" fill="none" stroke="#43809a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1282" y="383" width="275" height="58" rx="18" fill="#ffffff" stroke="#b9d6e4" stroke-width="2"/>
  <text x="1419" y="420" text-anchor="middle" fill="#244d61" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Gouttelette d’eau</text>

  <text x="915" y="858" fill="#365c70" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Chaque sphère représente une gouttelette.</text>
  <text x="915" y="894" fill="#5e7e8e" font-family="Arial, Helvetica, sans-serif" font-size="19">Les tailles et les espacements ne sont pas à l’échelle.</text>

  <line x1="100" y1="930" x2="1500" y2="930" stroke="#c6dfe9" stroke-width="2"/>
  <text x="100" y="966" fill="#668494" font-family="Arial, Helvetica, sans-serif" font-size="17">Schéma explicatif • Dans certains nuages, une partie de l’eau est sous forme de cristaux de glace.</text>
</svg>
